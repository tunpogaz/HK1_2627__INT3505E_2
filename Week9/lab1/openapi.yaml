openapi: 3.0.3
info:
  title: User API — URI Path Versioning (Week 9 Lab 1)
  version: 2.0.0
  description: |
    Minh họa URI Path Versioning với Flask Blueprint.
    Bao gồm 2 phiên bản API:
    - v1 (/api/v1/users/{id}): Schema cũ trả về full_name, đang trong giai đoạn Deprecated kèm Sunset header.
    - v2 (/api/v2/users/{id}): Schema mới tách thành first_name và last_name kèm POST /api/v2/users.
servers:
  - url: http://127.0.0.1:5000
paths:
  /api/v1/users/{uid}:
    parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: integer
        example: 1
    get:
      summary: Lấy thông tin user
      description: Trả về full_name kết hợp. Gắn kèm Sunset và Deprecation header.
      deprecated: true
      operationId: getUserV1
      responses:
        '200':
          description: Thành công
          headers:
            Sunset:
              schema:
                type: string
              example: "Thu, 31 Dec 2026 23:59:59 GMT"
              description: Thời điểm endpoint chính thức bị gỡ bỏ.
            Deprecation:
              schema:
                type: string
              example: "true"
              description: Cảnh báo deprecation.
            Link:
              schema:
                type: string
              example: '</api/v2/users>; rel="successor-version"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserV1'
        '404':
          description: Không tìm thấy user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/users/{uid}:
    parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: integer
        example: 1
    get:
      summary: Lấy thông tin user
      description: Trả về first_name và last_name riêng biệt.
      operationId: getUserV2
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserV2'
        '404':
          description: Không tìm thấy user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/users:
    post:
      summary: Tạo mới user
      description: Nhận first_name, last_name, email và tạo user mới trong hệ thống.
      operationId: createUserV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserV2Input'
      responses:
        '201':
          description: Tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserV2'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    UserV1:
      type: object
      required: [id, full_name, email]
      properties:
        id:
          type: integer
        full_name:
          type: string
          example: "Văn Nguyễn"
        email:
          type: string
          format: email
          example: "a@vnu.vn"

    UserV2:
      type: object
      required: [id, first_name, last_name, email]
      properties:
        id:
          type: integer
        first_name:
          type: string
          example: "Văn"
        last_name:
          type: string
          example: "Nguyễn"
        email:
          type: string
          format: email
          example: "a@vnu.vn"

    UserV2Input:
      type: object
      required: [first_name, last_name, email]
      properties:
        first_name:
          type: string
          example: "Hoàng"
        last_name:
          type: string
          example: "Lê"
        email:
          type: string
          format: email
          example: "hoang@vnu.vn"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string
